[project]
name = "fleet-console"
version = "0.1.0"
description = "Личный локальный веб-интерфейс поверх fleet"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nicegui>=3.18,<4",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.scripts]
fleet-console = "fleet_console.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
